name: CI / Deploy

# Push to main -> lint + build gate, then rebuild the stack on the droplet, from
# a runner that lives on it. Manual re-deploys via "Run workflow"
# (workflow_dispatch).
#
# The trigger list below is load-bearing for SECURITY, not just for scheduling:
# the deploy job runs on a self-hosted runner and this repository is PUBLIC.
# With no `pull_request` trigger a fork cannot reach the runner. Never add
# `pull_request` or `pull_request_target` here, and never point another
# workflow at `self-hosted` — either one hands the droplet to anyone who opens
# a pull request.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once; queue them (don't cancel a build mid-flight).
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Least privilege for GITHUB_TOKEN: without this block the repo/org default
# applies, which is often read+write on contents, packages, issues... Each job
# narrows it further below.
permissions: {}

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `next build` also type-checks; it must pass with no DB (same contract as
      # the Docker build stage, which builds without DATABASE_URL).
      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to the droplet
    needs: ci
    # Second lock, after the trigger list at the top of the file.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Runs ON the droplet. The runner dials out to GitHub, which removes the
    # three things that kept breaking this job: an inbound SSH port, a host
    # address in a secret that went stale when the droplet's IP changed (every
    # deploy failed for a month with `dial tcp ***:22: i/o timeout`), and a
    # production private key stored in GitHub.
    runs-on: [self-hosted, maarkn-prod]
    environment: production
    # No checkout, no API calls.
    permissions: {}
    steps:
      - name: Deploy (sync, build, migrate, restart)
        env:
          # The droplet is a DigitalOcean box; `EC2_*` names are legacy. Either
          # secret works, so the name can be migrated without a broken deploy.
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR || secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          cd "$APP_DIR"

          # Deploy the exact commit that passed `ci`, not whatever `main` points
          # at right now: a push landing between the two jobs would otherwise
          # ship code this run never tested. `concurrency` queues deploys, it
          # does not reorder them.
          echo "==> Syncing working tree to $GITHUB_SHA"
          git fetch --prune origin
          git reset --hard "$GITHUB_SHA"   # .env is gitignored, so it survives

          # Build BEFORE migrating. `migrate` is built from this checkout's
          # `builder` stage, but `docker compose run` reuses an existing image
          # instead of rebuilding it — so migrating first ran the PREVIOUS
          # deploy's migrations folder and reported "No pending migrations"
          # while new ones were waiting. The new app would then have started
          # against the old schema.
          # Two separate commands on purpose: one `build app migrate` lets
          # compose/bake build both targets in parallel, i.e. two `next build`
          # at once on a host that OOM-killed a single one. `migrate` goes
          # first (it IS the builder stage); `app` then reuses its cache.
          echo "==> Building images"
          docker compose -f docker-compose.prod.yml build migrate
          docker compose -f docker-compose.prod.yml build app

          echo "==> Applying database migrations"
          docker compose -f docker-compose.prod.yml up -d postgres
          docker compose -f docker-compose.prod.yml exec -T postgres \
            sh -c 'until pg_isready -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done'

          # A dump before EVERY migrate is the only undo for a migration.
          # The first deploy of the backoffice applies six at once, one of
          # which converts and then DROPS JobApplication. Custom format (-Fc)
          # so pg_restore can pick tables; the 5 most recent are kept.
          # `set -e` aborts here if the dump fails: never migrate without a
          # way back.
          mkdir -p "$HOME/db-backups"
          docker compose -f docker-compose.prod.yml exec -T postgres \
            sh -c 'pg_dump -Fc -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
            > "$HOME/db-backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
          ls -1t "$HOME"/db-backups/pre-deploy-*.dump | tail -n +6 | xargs -r rm --

          docker compose -f docker-compose.prod.yml run --rm migrate

          echo "==> Restarting the app"
          docker compose -f docker-compose.prod.yml up -d app traefik

          echo "==> Pruning dangling images"
          docker image prune -f
